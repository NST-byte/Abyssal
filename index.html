<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABYSSAL – Tiefsee-Idle</title>
  <meta name="description" content="Ein Tiefsee-Idle-Game: Sammle Biolumineszenz, tauche tiefer, wende die Gezeiten.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23041019'/%3E%3Ccircle cx='12' cy='12' r='5' fill='%235ff2e6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-depth="0">
  <canvas id="scene" aria-hidden="true"></canvas>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <defs><radialGradient id="lg" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#e9fffd"/><stop offset=".45" stop-color="#5ff2e6"/><stop offset="1" stop-color="#5ff2e6" stop-opacity="0"/></radialGradient></defs>
          <circle cx="20" cy="18" r="16" fill="url(#lg)" opacity=".45"/>
          <path d="M9 18a11 11 0 0 1 22 0c0 1.4-1.2 2-2.6 2H11.6C10.2 20 9 19.4 9 18z" fill="#5ff2e6"/>
          <path d="M13 21c-.8 4 1.4 6 0 11M18 21c.8 4-1.4 6 0 11M23 21c-.8 4 1.4 6 0 11M28 21c.6 3-1 5 0 8" stroke="#5ff2e6" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".75"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">ABYSSAL</span>
          <span class="brand-sub">Station Tethys-7</span>
        </div>
      </div>
      <div class="resources" id="resources" aria-live="off"></div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-save" type="button" aria-label="Speichern" title="Speichern"></button>
        <button class="icon-btn" id="btn-settings" type="button" aria-label="Einstellungen" title="Einstellungen"></button>
      </div>
    </header>

    <main class="layout">
      <section class="core-col" aria-label="Lumen-Kern">
        <div class="depth-box">
          <div class="depth-head"><span class="depth-label" id="depth-label">Schelfkante</span><span class="depth-meters" id="depth-meters">0 m</span></div>
          <div class="depth-bar" id="depth-bar"></div>
        </div>

        <div class="orb-wrap">
          <button id="orb" class="orb" type="button" aria-label="Lumen-Puls auslösen">
            <span class="orb-ring r1"></span><span class="orb-ring r2"></span>
            <svg class="orb-svg" viewBox="0 0 200 200" aria-hidden="true">
              <defs>
                <radialGradient id="orbcore" cx="50%" cy="42%" r="55%">
                  <stop offset="0" stop-color="#ffffff"/>
                  <stop offset=".25" stop-color="var(--orb-a)"/>
                  <stop offset=".7" stop-color="var(--orb-b)" stop-opacity=".55"/>
                  <stop offset="1" stop-color="var(--orb-b)" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <circle cx="100" cy="96" r="88" fill="url(#orbcore)" opacity=".5"/>
              <path class="bell" d="M48 96a52 52 0 0 1 104 0c0 6-5 9-11 9H59c-6 0-11-3-11-9z" fill="url(#orbcore)"/>
              <path class="bell-line" d="M58 98c10-34 74-34 84 0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
              <g class="tentacles" fill="none" stroke="var(--orb-a)" stroke-width="3" stroke-linecap="round" opacity=".8">
                <path d="M66 106c-5 18 7 26 0 48"/>
                <path d="M84 107c4 18-6 28 0 54"/>
                <path d="M100 107c-4 20 6 30 0 60"/>
                <path d="M116 107c4 18-6 28 0 54"/>
                <path d="M134 106c5 18-7 26 0 48"/>
              </g>
            </svg>
          </button>
          <div id="floaters" class="floaters" aria-hidden="true"></div>
        </div>

        <div class="orb-info">
          <div><span class="muted">Puls</span><b id="click-value">+1</b></div>
          <div><span class="muted">Lumen/s</span><b id="lps-value">0</b></div>
        </div>
        <div id="probe-box" class="probe-box panel" hidden></div>
        <div id="buffs" class="buffs" aria-live="polite"></div>
        <button id="ability-btn" class="ability" type="button" hidden></button>

        <div id="current-box" class="current-box panel" hidden></div>

        <div class="panel missions-panel" id="missions-panel">
          <h3 class="panel-h">Aufträge</h3>
          <div id="missions"></div>
        </div>
      </section>

      <section class="main-col">
        <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche"></nav>
        <div class="tab-body panel" id="tab-body"></div>
      </section>
    </main>
  </div>

  <div id="event-layer" class="event-layer"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="tutorial" class="tutorial" role="note" hidden>
    <div class="tut-text"></div>
    <div class="tut-actions"><button class="tut-skip" type="button">Tutorial überspringen</button><button class="tut-next btn btn-primary" type="button">Weiter</button></div>
  </div>

  <noscript><div class="noscript">ABYSSAL braucht JavaScript.</div></noscript>

  <script src="js/config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/state.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/unlocks.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/core.js"></script>
  <script src="js/save.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui-panels.js"></script>
  <script src="js/ui-station.js"></script>
  <script src="js/ui-research.js"></script>
  <script src="js/ui-map.js"></script>
  <script src="js/ui-tides.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
